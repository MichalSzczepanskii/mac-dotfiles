# Memory pieces for tmux (#79). Sourced by one source-file line in ~/.config/tmux/tmux.conf.
# Swap used, coloured by memory pressure (#81). Appends to the theme's status-right, so source this after the theme.
set -ga status-right "#(~/.config/memory/tmux-memory)"
# Idle LSP stop (#83): record leaving a session, bring LSP back on return. Fixed index [83] so a reload does not add it twice.
set-hook -g client-session-changed[83] 'run-shell -b "~/.config/memory/lsp-idle switched #{q:client_last_session} #{q:session_name}"'
